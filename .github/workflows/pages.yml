name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare public website only
        run: |
          mkdir -p _site/assets
          cp index.html styles.css script.js .nojekyll _site/
          rsync -a --prune-empty-dirs \
            --exclude='source-computer-society-light.jpg' \
            --include='*/' --include='*.svg' --include='*.png' \
            --include='*.jpg' --include='*.jpeg' --include='*.webp' \
            --include='*.avif' --include='*.gif' --include='*.ico' \
            --include='*.woff' --include='*.woff2' --include='*.ttf' \
            --include='FONT-LICENSE.txt' \
            --include='*.mp4' --include='*.webm' --include='*.ics' \
            --exclude='*' assets/ _site/assets/
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
